<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="HRM Huy Phong — quản lý dự án, chấm công, ca làm việc và nhân sự." />

    <!-- PWA: cài lên màn hình chính như một ứng dụng -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HRM Huy Phong" />
    <!-- Favicon SVG nội tuyến: khối vuông gradient thương hiệu + chữ T -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='36' font-weight='800' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E"
    />
    <title>HRM Huy Phong</title>

    <!--
      Mở kết nối tới Google Fonts ngay từ đầu. Trước đây font được nạp bằng
      @import trong index.css — trình duyệt chỉ biết tới nó SAU khi tải và phân
      tích xong CSS, nên chữ hiện muộn hơn hẳn. Preconnect + preload rút ngắn
      chuỗi phụ thuộc đó.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />

    <meta property="og:title" content="HRM Huy Phong" />
    <meta property="og:description" content="Quản lý dự án, giao việc, chấm công, bảng công và tính lương." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
